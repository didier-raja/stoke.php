<!DOCTYPE html>
<html>
<head>
    <title>Node.js + MySQL Frontend</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            background: #f3f3f3;
            padding: 20px;
        }
        h2{
            color: #333;
        }
        form, table{
            background: white;
            padding: 20px;
            border-radius: 6px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        input{
            width: 90%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button{
            padding: 10px 20px;
            background: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 4px;
        }
        button:hover{
            background: #0056b3;
        }
        table{
            width: 100%;
            border-collapse: collapse;
        }
        table th, table td{
            padding: 10px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }
        .btn-small{
            padding: 5px 10px;
        }
        .delete{
            background: red;
        }
        .update{
            background: green;
        }
    </style>
</head>

<body>

    <h2>Insert User</h2>
    <form id="insertForm">
        <input type="text" id="names" placeholder="Enter Names" required>
        <input type="email" id="email" placeholder="Enter Email" required>
        <input type="password" id="password" placeholder="Enter Password" required>
        <button type="submit">Save User</button>
    </form>

    <h2>User List</h2>
    <button onclick="loadUsers()">Load Users</button>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Names</th>
                <th>Email</th>
                <th>Password</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody id="userTable"></tbody>
    </table>

    <script>
        const API_URL = "http://localhost:5000";

        document.getElementById("insertForm").addEventListener("submit", async (e) => {
            e.preventDefault();

            const names = document.getElementById("names").value;
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            const response = await fetch(`${API_URL}/insert`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ names, email, password })
            });

            const result = await response.json();
            alert("User inserted successfully!");
            loadUsers();
        });

        async function loadUsers() {
            const res = await fetch(`${API_URL}/select`);
            const data = await res.json();

            const table = document.getElementById("userTable");
            table.innerHTML = "";

            data.select.forEach(user => {
                table.innerHTML += `
                    <tr>
                        <td>${user.id}</td>
                        <td>${user.names}</td>
                        <td>${user.email}</td>
                        <td>${user.password}</td>
                        <td>
                            <button class="btn-small update" onclick="updateUser(${user.id})">Update</button>
                            <button class="btn-small delete" onclick="deleteUser(${user.id})">Delete</button>
                        </td>
                    </tr>
                `;
            });
        }

        async function updateUser(id) {
            const names = prompt("Enter new name:");
            const email = prompt("Enter new email:");
            const password = prompt("Enter new password:");

            if (!names || !email || !password) {
                alert("All fields are required!");
                return;
            }

            await fetch(`${API_URL}/update/${id}`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ names, email, password })
            });

            alert("User updated!");
            loadUsers();
        }

        async function deleteUser(id) {
            if (!confirm("Are you sure you want to delete this user?")) return;

            await fetch(`${API_URL}/delete/${id}`, { method: "DELETE" });

            alert("User deleted!");
            loadUsers();
        }
    </script>

</body>
</html>
